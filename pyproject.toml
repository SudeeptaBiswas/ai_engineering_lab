[project]
name = "ai-engineering-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

# Installs lab_tools/ into .venv, so any file can: from lab_tools.log import ...
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab_tools"
module-root = ""  # lab_tools/ sits at repo root (not under src/)

[tool.pyright]
typeCheckingMode = "strict"  # same as Pylance in VS Code
# 1.9 tests import the 2.5 exercise files. Folders starting with a digit
# can't be packages, so the folder goes on the import path instead.
extraPaths = ["02_llm_fundamentals/2_5_embeddings"]

[tool.pytest.ini_options]
pythonpath = [
    "02_llm_fundamentals/2_5_embeddings",  # same reason as extraPaths
    ".",  # repo root: 2.6+ tests do `import assistant` (pyright finds it already)
]
markers = ["ollama: needs a running Ollama (skip with -m 'not ollama')"]
# Lesson files are not named test_*.py. Point pytest only at pytest-style
# folders (1.9+): older examples run code on import.
python_files = ["test_*.py", "examples_*.py", "exercises_*.py"]
